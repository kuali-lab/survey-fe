name: Deploy production (lxc-app)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-survey-fe
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            survey-fe:latest
            survey-fe:sha-${{ steps.sha.outputs.short }}
          build-args: |
            PUBLIC_API_URL=https://api.statistika.id
            PUBLIC_API_BASE_URL=https://api.statistika.id
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tarball
        run: |
          docker save survey-fe:latest survey-fe:sha-${{ steps.sha.outputs.short }} | gzip > /tmp/survey-fe.tar.gz
          ls -lh /tmp/survey-fe.tar.gz

      - name: Install SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.LXC_APP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.LXC_APP_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Transfer image to lxc-app
        run: |
          scp -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              /tmp/survey-fe.tar.gz \
              ${{ secrets.LXC_APP_USER }}@${{ secrets.LXC_APP_HOST }}:/tmp/survey-fe.tar.gz

      - name: Deploy on lxc-app
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              ${{ secrets.LXC_APP_USER }}@${{ secrets.LXC_APP_HOST }} \
              "set -e
               echo '== load image =='
               gunzip -c /tmp/survey-fe.tar.gz | docker load
               rm /tmp/survey-fe.tar.gz
               echo '== compose up =='
               cd /opt/survey-fe
               docker compose up -d
               echo '== wait for / =='
               for i in \$(seq 1 30); do
                 if wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; then
                   echo 'survey-fe healthy'
                   exit 0
                 fi
                 sleep 2
               done
               echo 'health check timeout' >&2
               docker logs survey-fe --tail 80
               exit 1"

      - name: Verify via Traefik
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              ${{ secrets.LXC_APP_USER }}@${{ secrets.LXC_APP_HOST }} \
              "curl -fsSL -o /dev/null -w 'traefik->survey-fe: HTTP %{http_code}\n' -H 'Host: survey.statistika.id' http://127.0.0.1/"

      - name: Cleanup old images on lxc-app
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              ${{ secrets.LXC_APP_USER }}@${{ secrets.LXC_APP_HOST }} \
              "docker image prune -f --filter 'until=168h' || true"
