<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Default title & description (overridden per-page via <svelte:head>) -->
    <title>Logika Statistik Survey</title>
    <meta name="description" content="Isi survei dari Logika Statistik — platform riset dan analisis statistik." />
    <meta name="application-name" content="Logika Statistik Survey" />

    <!-- Favicon chain dideklarasikan di +layout.svelte, BUKAN di sini.
         Alasannya: survei bisa punya favicon sendiri, dan SvelteKit cuma
         menggabung isi <svelte:head> tanpa deduplikasi — ikon di sini akan
         berdampingan dengan ikon survei, tanpa jaminan mana yang dipakai
         peramban. Satu tempat deklarasi = nol ambiguitas. -->

    <!-- PWA manifest -->
    <link rel="manifest" href="%sveltekit.assets%/icons/site.webmanifest" />

    <!-- Browser chrome color -->
    <meta name="theme-color" content="#f7bb00" />

    <!-- Default Open Graph. og:image, twitter:image, DAN twitter:card
         dipancarkan +layout.svelte (rute non-survei) atau halaman survei —
         tepat satu sumber untuk masing-masing. twitter:card dulu ditetapkan
         di sini tanpa syarat dan beradu dengan tag bersyarat milik halaman
         survei; yang menang tidak pasti. -->
    <meta property="og:site_name" content="Logika Statistik" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:type" content="website" />

    <!-- Fonts — body=Source Sans 3, display=Nunito Sans (matches dashboard-fe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
