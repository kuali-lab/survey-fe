<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Default title & description (overridden per-page via <svelte:head>) -->
    <title>Logika Teta Survey</title>
    <meta name="description" content="Isi survei dari Logika Teta — platform riset dan analisis statistik." />
    <meta name="application-name" content="Logika Teta Survey" />

    <!-- Favicon chain: SVG (modern) → ICO (legacy) -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/icons/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%sveltekit.assets%/icons/site.webmanifest" />

    <!-- Browser chrome color -->
    <meta name="theme-color" content="#f7bb00" />

    <!-- Default Open Graph (overridden per-page) -->
    <meta property="og:site_name" content="Logika Teta" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://survey.logika-teta.web.id/logo-logika-teta.png" />

    <!-- Default Twitter Card (overridden per-page) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://survey.logika-teta.web.id/logo-logika-teta.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
